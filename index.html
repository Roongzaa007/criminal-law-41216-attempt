<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Law STOU — เรียนกฎหมายฉบับอัจฉริยะ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Noto+Serif+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --gold-dim: #8A6E2F;
    --dark: #0D0D12;
    --dark2: #16161F;
    --dark3: #1E1E2A;
    --text: #F0EDE6;
    --text-dim: #9A9490;
    --fb-blue: #1877F2;
  }

  html, body {
    height: 100%;
    background: var(--dark);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1rem;
    position: relative;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 39px,
        rgba(201,168,76,0.04) 40px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 39px,
        rgba(201,168,76,0.04) 40px
      );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    text-align: center;
    animation: fadeUp 0.8s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Top ornament */
  .ornament {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    margin-bottom: 2rem;
    opacity: 0.5;
  }
  .ornament-line {
    flex: 1;
    max-width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .ornament-line.right {
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .ornament-diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  /* Lock icon */
  .icon-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.3);
    background: rgba(201,168,76,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 3s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.15); }
    50%       { box-shadow: 0 0 0 12px rgba(201,168,76,0); }
  }
  .icon-wrap svg {
    width: 32px;
    height: 32px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Heading */
  .label {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: 'Noto Serif Thai', serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 0.4rem;
  }
  h1 span { color: var(--gold); }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 2rem;
  }

  /* Card */
  .card {
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 16px;
    padding: 1.75rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  .card-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }
  .page-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--dark3);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .page-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--fb-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    font-family: 'Sarabun', sans-serif;
  }
  .page-info { text-align: left; }
  .page-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .page-desc {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* CTA Button */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 24px;
    border-radius: 10px;
    background: var(--fb-blue);
    color: #fff;
    font-family: 'Sarabun', sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.2s;
    border: none;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn svg {
    width: 20px; height: 20px;
    fill: #fff;
    flex-shrink: 0;
  }

  /* Footer */
  .footer {
    font-size: 11px;
    color: var(--text-dim);
    opacity: 0.5;
    margin-top: 1rem;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="container">

  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-diamond"></div>
    <div class="ornament-line right"></div>
  </div>

  <div class="icon-wrap">
    <!-- Lock icon -->
    <svg viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>

  <p class="label">Smart Law STOU</p>
  <h1>Mind Map <span>กฎหมาย มสธ.</span></h1>
  <p class="subtitle">
    เนื้อหานี้ได้ย้ายไปยังช่องทางพิเศษแล้วครับ<br>
    สามารถเข้าถึง Mind Map และสรุปกฎหมาย<br>
    ได้ที่เพจ Facebook ด้านล่างนี้
  </p>

  <div class="card">
    <p class="card-label">เข้าถึงเนื้อหาได้ที่</p>
    <div class="page-row">
      <div class="page-avatar">f</div>
      <div class="page-info">
        <div class="page-name">Smart Law STOU</div>
        <div class="page-desc">เรียนกฎหมายฉบับอัจฉริยะ</div>
      </div>
    </div>
    <a class="btn" href="https://www.facebook.com/profile.php?id=61572221952896" target="_blank" rel="noopener">
      <!-- Facebook logo -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
      </svg>
      ไปที่เพจ Facebook
    </a>
  </div>

  <p class="footer">Smart Law STOU © 2025 · เรียนกฎหมาย มสธ. ฉบับอัจฉริยะ</p>

</div>

</body>
</html>
